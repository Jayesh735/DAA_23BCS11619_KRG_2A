# 1. Server Port
# Change the default port from 8080 to 9090 (so it doesn't conflict with React)
server.port = 9090

# 2. H2 Database Configuration
# Enable the H2 console so we can view our database in the browser
spring.h2.console.enabled=true
# Set the path for the H2 console
spring.h2.console.path=/h2-console

# 3. Database Connection Settings
# This is the standard JDBC URL for an in-memory H2 database named 'searchsensedb'
spring.datasource.url=jdbc:h2:mem:searchsensedb
spring.datasource.driverClassName=org.h2.Driver
# Login credentials (simple for a dev database)
spring.datasource.username=sa
spring.datasource.password=password

# 4. JPA (Java Persistence API) Settings
# This tells JPA which "dialect" to use for H2
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# This is the most important setting:
# It tells Hibernate (our JPA provider) to create or update our database tables
# automatically based on our @Entity classes when the application starts.
spring.jpa.hibernate.ddl-auto=update